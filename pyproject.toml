[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacescan"
version = "0.1.0"
description = "Offline, uncertainty-aware room measurement pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.scripts]
spacescan = "spacescan.cli:main"
spacescan-evaluate = "spacescan.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
